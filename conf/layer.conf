# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "good-old-games"
BBFILE_PATTERN_good-old-games := "^${LAYERDIR}/"
BBFILE_PRIORITY_good-old-games = "11"

# This layer provides the games that run on the seat, one branch per Yocto
# release, and this branch is the one for scarthgap. Everything here is a game,
# a game engine, or a payload an engine runs on - the applications stay in
# meta-embedded-apps. Every recipe lives under recipes-games (and the bundled
# dependencies under recipes-multimedia and recipes-devtools), never under
# recipes-apps, which is the apps layer's directory.
#
# What decides whether a game has a recipe here: a game is in only if it is free
# to download AND free to play, on the rights holder's own words, pinned as a
# LicenseRef in the recipe e.g shareware/freeware/demo, AND the download source
# is one the rights holder authorizes. Where the only carrier on hand is a third
# party's mirror of a corner the owner stopped answering - id's idstuff tree is
# served today by gwdg.de, and nobody from id answers for that mirror - the
# engine stays the recipe and the data does not: the engine's own README carries
# where to put your own copy on the seat and the exact command that runs it, and
# no recipe in this layer fetches from that mirror. The same rule keeps the seat's
# game data off /usr: the payloads the seat keeps live on its /gamedata mount.
#
# The recipes it provides:
#   chocolate-doom_git.bb     - Chocolate Doom 3.1.1, the one engine the DOOM,
#                                 Heretic and Hexen games run on; the WAD's own
#                                 file name is what decides the game
#   fteqw_git.bb              - fte-team/fteqw compiled gles-only, the engine
#                                 the Quake 1, QuakeWorld, Quake II, Quake III
#                                 and Hexen II trees run on, each one a
#                                 -basedir/-game pair
#   ioquake3_git.bb           - ioquake3 1.36 as one opengl2/GL ES client, the
#                                 engine swap that made the Quake III route draw,
#                                 and what Quake III: Team Arena is played on
#   eduke32_20260807.bb       - EDuke32 built with USE_OPENGL=0 so the CLASSIC
#                                 software renderer draws through SDL2: the seat
#                                 has EGL and GLES only, and the tree's whole GL
#                                 path is desktop #version 110/120/130
#   dosbox-x_git.bb           - DOSBox-X, the one thing on the seat that speaks
#                                 x86 DOS, which is what the two Descent releases
#                                 run on
#   openjazz_git.bb           - OpenJazz, the SDL2 reimplementation that reads
#                                 Epic's original Jazz data in place, and the
#                                 same engine's -DENABLE_JJ2=ON for Jazz 2
#   xash3d-fwgs_git.bb        - Xash3D FWGS built as an OpenGL ES GoldSrc client
#                                 (-ref gles3compat is the renderer this EGL/GLES-
#                                 only seat can drive), and what Up-link and Sven
#                                 Co-op run on
#   librequake.bb             - LibreQuake v0.09-beta free Quake data, as an id1
#                                 tree FTEQW reads
#   openarena.bb              - OpenArena 0.8.8 free arena data (baseoa + missionpack)
#   ut99_469f.bb              - Unreal Tournament 99 GOTY on OldUnreal's 469f
#                                 arm64 engine, at /gamedata/ut, drawn by SoftDrv
#   unreal-gold_1.0.bb        - Epic's 1998 campaign inside that same 469f engine,
#                                 at /gamedata/ugt
#   opennow_git.bb            - OpenCloudGaming/OpenNOW: signs the seat into the
#                                 CloudMatch account and keeps the account record
#   opennowlite_git.bb        - the plan-B OpenNOWLite client: it fetches the same
#                                 upstream pin and applies its own one patch to it,
#                                 then plays the host's stream in its own Wayland
#                                 window with its own GStreamer pipeline
# plus the dependency recipes those clients need and the existing stack lacks:
#   libsdl3 (SDL 3.x, required by OpenNOW)
#   rust-1.85.0-host and rust-1.89.0-host (the host cargo their do_compile runs)
#
# The games whose data is not a recipe here are hand installs, and the shelf of
# them - which game, whose release, whose licence words and where the data goes
# on the seat - is the table in the layer's README.
#
# It does NOT provide meta-qt6, meta-rust-bin or meta-clang. Those updated
# layers are re-added by the Watermelon-Wine BSP manifest and MUST be on
# BBLAYERS (they are currently represented by the "qt6-layer",
# "rust-bin-layer" and "clang-layer" collections).
LAYERDEPENDS_good-old-games = "core openembedded-layer meta-python multimedia-layer"

# Matches the release series of the surrounding oe-core layers
LAYERSERIES_COMPAT_good-old-games = "scarthgap"
